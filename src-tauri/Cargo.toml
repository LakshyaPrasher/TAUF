[package]
name = "tauf"
version = "0.1.0"
description = "TAUF — Minimalist single-view identity-driven OSINT desktop workbench"
authors = ["TAUF"]
edition = "2021"

[lib]
name = "tauf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "process", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks", "gzip"] }
rusqlite = { version = "0.32", features = ["bundled"] }
md-5 = "0.10"
base64 = "0.22"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
urlencoding = "2"
regex = "1"
futures = "0.3"
dirs = "5"
